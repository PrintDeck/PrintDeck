blueprint:
  name: "PrintDeck : Allumer une lumière à la fin de l’impression"
  description: >-
    Surveille le capteur Phase d’impression d’une imprimante PrintDeck et
    allume la lumière choisie lorsque la phase devient Terminée.
  domain: automation
  author: kitek
  homeassistant: {min_version: 2025.10.0}
  input:
    print_phase:
      name: Capteur de phase d’impression
      description: Sélectionnez l’entité Phase d’impression de l’imprimante.
      selector: {entity: {filter: [{integration: printdeck, domain: sensor, device_class: enum}]}}
    light_target:
      name: Lumière
      description: Sélectionnez la lumière à allumer lorsque l’impression se termine.
      selector: {target: {entity: {domain: light}}}
triggers:
  - {trigger: state, entity_id: !input print_phase, to: completed}
conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and
         trigger.from_state.state in ['preparing', 'printing', 'paused'] }}
actions:
  - {action: light.turn_on, target: !input light_target}
mode: single

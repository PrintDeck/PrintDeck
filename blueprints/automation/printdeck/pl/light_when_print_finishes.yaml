blueprint:
  name: "PrintDeck: Włącz światło po zakończeniu wydruku"
  description: >-
    Obserwuje sensor Faza wydruku jednej drukarki PrintDeck i włącza wybrane
    światło, gdy faza zmieni się na Zakończono.
  domain: automation
  author: kitek
  homeassistant:
    min_version: 2025.10.0
  input:
    print_phase:
      name: Sensor fazy wydruku
      description: Wybierz encję Faza wydruku należącą do drukarki.
      selector:
        entity:
          filter:
            - integration: printdeck
              domain: sensor
              device_class: enum
    light_target:
      name: Światło
      description: Wybierz światło, które ma się włączyć po zakończeniu wydruku.
      selector:
        target:
          entity:
            domain: light

triggers:
  - trigger: state
    entity_id: !input print_phase
    to: completed
conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and
         trigger.from_state.state in ['preparing', 'printing', 'paused'] }}
actions:
  - action: light.turn_on
    target: !input light_target
mode: single

blueprint:
  name: "PrintDeck: Encender una luz al terminar la impresión"
  description: >-
    Observa el sensor Fase de impresión de una impresora PrintDeck y enciende
    la luz seleccionada cuando la fase cambia a Completada.
  domain: automation
  author: kitek
  homeassistant: {min_version: 2025.10.0}
  input:
    print_phase:
      name: Sensor de fase de impresión
      description: Selecciona la entidad Fase de impresión de la impresora.
      selector: {entity: {filter: [{integration: printdeck, domain: sensor, device_class: enum}]}}
    light_target:
      name: Luz
      description: Selecciona la luz que se encenderá al terminar la impresión.
      selector: {target: {entity: {domain: light}}}
triggers:
  - {trigger: state, entity_id: !input print_phase, to: completed}
conditions:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and
         trigger.from_state.state in ['preparing', 'printing', 'paused'] }}
actions:
  - {action: light.turn_on, target: !input light_target}
mode: single
